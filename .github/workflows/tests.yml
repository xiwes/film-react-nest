name: Tests 14 sprint

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
env:
  DIR_TESTS: /tmp/tests-back-to-the-film
  REP_TESTS: https://github.com/Yandex-Practicum/tests-back-to-the-film.git
jobs:
  test_backend:
    runs-on: ubuntu-latest
    steps:
    - name: Set up GitHub Actions
      uses: actions/checkout@v4
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
    - name: Get testing lib
      run: set -eu && git clone --depth 1 $REP_TESTS $DIR_TESTS
    - name: Run tests
      run: bash $DIR_TESTS/bin/backend.sh
  test_endpoints:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: exampleuser
          POSTGRES_PASSWORD: examplepass
          POSTGRES_DB: exampledb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exampleuser -d exampledb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - name: Set up GitHub Actions
      uses: actions/checkout@v4
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
    - name: Get testing lib
      run: set -eu && git clone --depth 1 $REP_TESTS $DIR_TESTS
    - name: Fill database
      env:
        PGPASSWORD: examplepass
      run: |
        for f in init films shedules; do
          psql -h localhost -U exampleuser -d exampledb -v ON_ERROR_STOP=1 -q -f backend/test/prac.$f.sql
        done
    - name: Start project
      working-directory: backend
      run: |
        cp .env.example .env
        npm ci
        npm run build
        npm run start &
    - name: Run tests
      run: bash $DIR_TESTS/bin/endpoints.sh
